[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagging-for-correct-aggregation"
version = "0.1.0"
description = "Measuring how column tagging and an enforcing MCP tool reduce LLM aggregation errors on restaurant-sector data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Scripts in src/ are run directly (python src/build_db.py); no installable package.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]
