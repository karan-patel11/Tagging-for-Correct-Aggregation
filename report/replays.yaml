# Replays and plain-language notes for docs/index.html (SPEC §13.1). Picked by the author after the
# full run (2026-10-28). Selection and wording only: every result shown on the page (answers, scores,
# counts, rates) is read from the eval output files by report/build_report.py. Notes carry no result
# numbers.
#
# runs: which recorded run to show for each setup. The page also shows each setup's record across
# all of its runs, so a single run is never presented as the whole story.
# expect: what each shown run must have scored (correct, incorrect, trap, unparsed). The build fails
# if the recorded run differs, so a note can never describe a failure that did not happen.
# untested_remedy: optional. A fix proposed for an observed failure. It was not implemented or
# measured, and the page labels it that way.

problem_question: q003   # section 1 explainer; must not imply any setup failed it

replays:
  - question_id: q003
    runs: {A: 1, B: 1, C: 1, D: 1}
    expect: {A: correct, B: correct, C: correct, D: correct}
    note: >-
      Total assets is a balance, not a flow. Every recorded run used the year-end balance correctly.

  - question_id: q010
    runs: {A: 1, B: 1, C: 1, D: 1}
    expect: {A: incorrect, B: correct, C: incorrect, D: correct}
    note: >-
      The arithmetic is correct across all runs. The missing caveat matters: Darden ends its fiscal
      year in May; Chipotle and Yum end in December. D's tool flagged the mismatch. This is the only
      question where B and C differ by majority vote.

  - question_id: q017
    runs: {A: 2, B: 1, C: 1, D: 1}
    expect: {A: trap, B: correct, C: correct, D: correct}
    note: >-
      A read the question as asking for the full year, although the question names the 14-week
      quarter. It wrote that "the full year is the figure you asked about", gave the derived fourth
      quarter only as a cross-check, and put the full-year figure in FINAL. The full-year row is
      stored with fiscal_quarter set to the fourth quarter. This was the only stored-trap hit. A's
      other runs answered correctly.

  - question_id: q018
    runs: {A: 1, B: 1, C: 1, D: 1}
    expect: {A: correct, B: correct, C: correct, D: correct}
    note: >-
      The question asks for percent change in the index. Every setup used the correct calculation.

  - question_id: q030
    runs: {A: 1, B: 1, C: 1, D: 1}
    expect: {A: correct, B: correct, C: correct, D: unparsed}
    note: >-
      D requested annual views from a tool that accepts calendar quarters. After the requests were
      rejected, it hit the token limit without a final answer. Its other runs recovered by combining
      quarterly calls. A, B and C answered with SQL. The data was available; the failure came from
      the tool interface.
    untested_remedy: >-
      Let the pageview tool accept a calendar year, or say in its error that a year can be built
      from quarterly calls.

  - question_id: q034
    runs: {A: 1, B: 1, C: 1, D: 1}
    expect: {A: correct, B: correct, C: correct, D: incorrect}
    note: >-
      D refused after trying unsupported comps lookups. The data was available: a multi-company
      aggregate call returns each value and its definition with a warning. D found that route in its
      other runs. A, B and C queried the rows and warned that the definitions differ.
    untested_remedy: >-
      Add a single-company comps lookup, or make the rejection point to the multi-company aggregate
      call.

tag_cards:
  - id: fundamentals.total_assets
    sentence: >-
      Use the last quarter-end balance for the year. Do not sum balances across quarters.
  - id: fundamentals.op_cash_flow
    sentence: >-
      Cash-flow statements report year-to-date totals. Derive later quarters by subtracting the
      preceding year-to-date total.

# SPEC §11.8. Sample-size figures are filled in from the data at build time.
limitations:
  - "Small sample: {questions_per_category} questions per category, {companies} companies."
  - "One model."
  - >-
    The author wrote both the questions and the system, a source of bias. Most questions were
    drafted before the core logic existed; replacement questions were added after it existed.
    All questions were frozen (git tag questions-frozen) before any evaluation run.
  - "In setup D, the interface and the enforcement change together."
  - >-
    D's tools cover the question categories closely, so D's advantage on answerable questions is
    partly by design. The unanswerable and out-of-coverage questions are D's real test.
  - "Pageviews are only a proxy for real alternative data."
  - "No 10-K or 10-Q amendments are included."
  - >-
    After the study, the engine was hardened (followup/engine_fix/REPLAY.md). The results above
    were produced at commit {results_commit}; re-executing the {replay_calls} recorded setup D tool
    calls on the hardened engine gave identical outputs for {replay_identical} of {replay_calls}.
  - "A short window of recent filings."

links:
  repo: https://github.com/karan-patel11/Tagging-for-Correct-Aggregation
  error_analysis: docs/error_analysis.md
