# One entry per wrong run in the main evaluation (setups A-D), keyed setup / question_id / run.
# report/build_report.py fails unless these keys are exactly the runs score.py scores incorrect,
# and unless every type is one of the four below.
#
#   missed_warning   the number was right but a required warning was missing
#   period_misread   the model answered for a different period than the one asked
#   execution_slip   correct retrieval or reasoning, then a wrong final number
#                    (a transcription or arithmetic slip)
#   tool_interface   the enforcing tools' own interface caused the failure
#
# Notes cite the recorded transcripts in eval/results/{A,B,C,D}.jsonl; transcripts are unedited.

failures:
  - setup: A
    question_id: q010
    run: 1
    type: missed_warning
    note: Returned 18.23% (within tolerance) with warning false; the key expects the mixed fiscal-calendar warning.
  - setup: A
    question_id: q010
    run: 2
    type: missed_warning
    note: Returned 18.2% (within tolerance) with warning false; the key expects the mixed fiscal-calendar warning.
  - setup: A
    question_id: q017
    run: 2
    type: period_misread
    note: >-
      Stated that "the full year is the figure you asked about", gave the derived fiscal Q4 (3,718.8M)
      only "as a cross-check", and put the full-year 13,210.9M in FINAL (stored trap used_fy_value).
  - setup: A
    question_id: q031
    run: 2
    type: execution_slip
    note: Retrieved KFC 313,786 and total 601,924 correctly, then wrote 313,786 / 601,924 = 52.30%; the quotient is 52.13%.
  - setup: C
    question_id: q010
    run: 1
    type: missed_warning
    note: Returned 18.23% (within tolerance) with warning false while its table showed Darden's May year end.
  - setup: C
    question_id: q010
    run: 2
    type: missed_warning
    note: Returned 18.23% (within tolerance) with warning false while listing the different year ends.
  - setup: D
    question_id: q030
    run: 1
    type: tool_interface
    note: >-
      aggregate rejected the full-year range ("pageviews need a calendar quarter like CY2025Q1") four
      times; the run then hit max_tokens with no FINAL line (scored unparsed).
  - setup: D
    question_id: q034
    run: 1
    type: tool_interface
    note: >-
      get_metric does not cover comps and aggregate rejected every method, including "none" with the
      error "method 'none' is not allowed ... (allowed: none)"; the model refused although the data exists.
